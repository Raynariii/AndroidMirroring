name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # The PR's own commit, not GitHub's temporary merge commit, so it matches what the PR shows.
      BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Name the APK after its commit
        run: cp app/build/outputs/apk/debug/app-debug.apk "../androidmirroring-${BUILD_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: androidmirroring-debug-${{ env.BUILD_SHA }}
          path: androidmirroring-*.apk

  mac:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - name: Build MirrorSpike
        run: swift build -c release
